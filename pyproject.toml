[build-system]
# >=83 clears PYSEC-2026-3447, where MANIFEST.in exclusions could be bypassed by
# Unicode normalization when building an sdist on macOS, so a file meant to be
# excluded could ship inside one. Not reachable here: Linux, and no sdist is
# published.
#
# This floor applies to the *build* environment, which PEP 517 isolates. It
# cannot be raised in the runtime environment, because acryl-datahub 1.6.0.13
# declares setuptools<82.0.0, so `pip install "setuptools>=83"` alongside it
# reports a dependency conflict. Anyone auditing an environment with the SDK
# installed will therefore still see that advisory, through no choice of this
# project's, which is why CI reports the audit rather than failing on it
# (D-051, and filed as feedback for DataHub).
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
# The *distribution* name, what `pip install` takes, not the package a user
# imports or the CLI commands they type: [project.scripts] below still installs
# `janus`, `janus-mcp`, `janus-seed`, `janus-scenario`
# regardless of this name, and [tool.setuptools.packages.find] still finds the
# `janus/` import package under it. It is "-datahub" and not the bare
# "janus" because that exact name is already registered on PyPI by an
# unrelated, apparently abandoned package (checked 2026-07-23: one release,
# 0.1.0, summary "TODO"); PyPI names are global and are not reclaimed because a
# package looks unused, so publishing under it is not an option (D-055).
name = "janus-datahub"
version = "0.1.0"
description = "A data-to-model reliability agent built on DataHub"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Janus Contributors" }]
keywords = ["datahub", "mlops", "data-lineage", "data-quality", "ml-reliability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    # No "License :: OSI Approved :: Apache Software License" classifier: setuptools
    # >=83 implements PEP 639 and rejects the classic classifier as redundant once
    # `license = "Apache-2.0"` above is a valid SPDX expression (verified: building
    # with both present raises InvalidConfigError, not a warning). The license
    # field is the single source of truth now; the classifier would be a second one
    # that could drift from it.
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
# The floor is real: 3.11 syntax is used throughout. The ceiling is not a
# preference, it is the first version this project has no evidence for.
#
# This used to cap at <3.12 because acryl-datahub's CLI prints "Python versions
# above 3.11 are not actively tested with yet". That is a warning, not a
# failure, and capping on it made the package uninstallable on every current
# distro Python: Ubuntu 24.04 ships 3.12, 25.04 ships 3.13, and neither carries
# 3.11 in its default repositories, so `pip install janus-datahub` failed
# outright with "requires a different Python" for the ordinary user (D-074).
# Verified on 3.12.3: install, `scan`, `gate`, leakage detection and the trust
# score all behave identically to 3.11. Development still targets 3.11
# (see .python-version), which is what CI runs.
requires-python = ">=3.11,<3.14"

# janus-datahub is a library on PyPI now, not only an application: an
# environment that already holds pydantic or rich for something else (FastAPI,
# LangChain, dbt adapters, most ML tooling) must be able to install this next
# to it. Exact pins fought the resolver instead (F2, docs/plan/07). The SDK is
# the one exception, and stays exact rather than a floor-and-ceiling range: a
# range here does not solve F2 at all (nobody else in a user's environment also
# needs this exact SDK, unlike pydantic or rich, which are near-universal), and
# widening it to `<2` was tried and reverted after it let CI resolve 1.6.0.17,
# four patches past the one version (1.6.0.13) verified symbol by symbol
# (D-012), and that patch changed the incident-entity-types schema enough to
# fail tests written against 1.6.0.13's behaviour (INCIDENT_ENTITY_TYPES is
# read from the installed package, so this is not hypothetical). A bump here
# is a decision made by running `pytest -m integration` against the new
# version and editing this line, never something a resolver picks on its own.
dependencies = [
    "acryl-datahub[datahub-rest]==1.6.0.13",
    # Used through a stable, small surface (BaseModel/SecretStr, a dotenv
    # loader, safe_load, a Console, a Typer app): no reason to force a
    # resolver's hand on any of these.
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0,<2",
    "PyYAML>=6.0,<7",
    "rich>=13.0,<16",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
# The narrator drafts incident and report prose. It is bring-your-own-LLM and
# provider-agnostic: install exactly the binding for the provider you configure
# in JANUS_LLM_PROVIDER. None of them is a core dependency, because
# `janus scan` falls back to deterministic template prose when no LLM is
# configured, and that is the judge's out-of-the-box path.
anthropic = ["langchain-anthropic==1.4.8"]
openai = ["langchain-openai==1.3.4"]
google = ["langchain-google-genai==4.2.7"]

# The human-approval agent (janus/agent/graph.py) and `scan --review`.
# Only langgraph is needed: the StateGraph's nodes call Janus's own
# deterministic detect/write functions, so there is no LLM tool-caller and thus
# no umbrella `langchain` dependency. The narrator's langchain-core comes from
# whichever provider extra is installed.
agent = [
    "langgraph==1.2.9",
]
# DataHub's own Agent Context Kit, read-only, used by
# janus/agent/context_kit.py to ground the narrator in the organizational
# context a detector does not collect (owners, domain, description, and the
# catalog's own health for the asset).
#
# NOT an installable extra, deliberately, and this is not an oversight: every
# release of datahub-agent-context from 1.6.0.6 onward pins
# `acryl-datahub[datahub-rest]==1.6.0.6` exactly, including 1.7.0, while this
# project pins 1.6.0.13. pip answers ResolutionImpossible for the pair, so
# declaring the extra would ship an install command that cannot succeed.
# Measured, and reported upstream as feedback #16. The integration is written to
# the kit's public API and degrades to None when it is absent, so it starts
# working the moment that pin is loosened, or today in an environment pinned to
# acryl-datahub 1.6.0.6:
#
#   pip install "datahub-agent-context[langchain]"
#
# context = ["datahub-agent-context[langchain]"]  # blocked: see above
# janus-mcp: the detectors exposed conversationally, read-only, for an MCP
# client such as Claude Desktop (janus/mcp_server.py). Optional because the
# batch scan, watch, and gate paths need no MCP runtime at all, and this is a
# third trigger surface, not a dependency of the other two.
mcp = [
    "mcp==1.28.1",
]
# Argos, the desktop watchdog (docs/plan/08-watchdog-mascot.md). The window is a
# Tauri binary, so unlike every other extra this one is a platform wheel rather
# than pure Python.
#
# The marker is not a workaround, it is the honest form of a policy: the binary
# links the system webkit2gtk, which no manylinux tag permits, so PyPI cannot
# accept a Linux wheel. Linux installs the .deb or .AppImage from the GitHub
# release, and `janus watch --pet` finds it on PATH exactly the same way.
# With neither installed, the pet degrades to a terminal line and says so.
pet = [
    "janus-argos==0.1.0; platform_system != 'Linux'",
]
# `janus link --from feast`: reading the join out of a Feast feature repo
# (janus/adapters/feast.py). The adapter parses the repo's own declarations
# through feast itself, offline, so feast has to be importable; it is an extra
# because nothing else in the product needs it, and the dbt adapter beside it
# needs no dependency at all (a manifest is JSON).
#
# The floor is the version the adapter was verified against, not the oldest that
# might work: label views, which are the only place a Feast repo names the column
# a model predicts, are recent. Below it the adapter still reads features and
# reports that it found no label.
feast = [
    "feast>=0.65,<1",
]
# `janus watch` exporting its own scan numbers over OTLP
# (janus/telemetry.py). Deliberately three instruments and no traces: a
# team that wants spans across the DataHub SDK's HTTP calls installs
# opentelemetry-instrumentation-requests and gets them, rather than this project
# shipping a second, worse copy of somebody else's product (09 section 3.3).
#
# The HTTP exporter rather than the gRPC one: it carries no grpcio wheel, and a
# collector accepts OTLP over either. Both packages are pinned together because
# the SDK and its exporters are released as one version and are not mixed.
otel = [
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
]
# `janus watch --events`: consuming DataHub's own MetadataChangeLog so a
# scan happens when the graph changes, and so a `link` an ingestion run drops is
# re-applied catalog-wide (janus/mcl.py, T-20).
#
# confluent-kafka rather than datahub-actions, which would deliver the same
# records through a plugin system with its own YAML configuration and its own
# CLI: a second configuration surface beside env.py is what root rule 6 exists
# to prevent. The topic and its Avro schema are DataHub's published contract
# either way. The schemaregistry and avro extras are what decode the Confluent
# framing GMS's own registry serves.
kafka = [
    "confluent-kafka[avro,schemaregistry]==2.15.0",
]
dev = [
    # The strict mypy hook scans every package module, including the optional
    # approval agent and MCP server. Keep the dev environment complete so a
    # clean clone does not silently skip its tests or fail type checking.
    "confluent-kafka[avro,schemaregistry]==2.15.0",
    "feast>=0.65,<1",
    "langgraph==1.2.9",
    "mcp==1.28.1",
    "mutmut==3.7.0",
    "mypy==2.2.0",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "pre-commit==4.6.0",
    "pytest==9.1.1",
    "ruff==0.15.21",
    "types-PyYAML==6.0.12.20260518",
]

[project.urls]
Homepage = "https://github.com/Ahmedxsaad/janus"
Repository = "https://github.com/Ahmedxsaad/janus"
Issues = "https://github.com/Ahmedxsaad/janus/issues"

[project.scripts]
# The CLI exposes the batch scan, polling watch, and CI gate commands.
janus = "janus.cli:main"
janus-seed = "janus.seed.seed_ml_graph:main"
janus-scenario = "janus.seed.scenarios:main"
janus-mcp = "janus.mcp_server:main"

[tool.setuptools.packages.find]
include = ["janus*"]

[tool.setuptools.package-data]
janus = ["writeback/props/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "D", "ANN", "BLE"]
# D203/D213 conflict with D211/D212; pick the one-blank-line-before-class and
# summary-on-first-line style. ANN401 would ban typing.Any in **kwargs.
ignore = ["D203", "D213", "ANN401"]

[tool.ruff.lint.per-file-ignores]
# Tests document themselves through their names; docstrings on every assert
# helper add noise without adding information.
"tests/*" = ["D100", "D101", "D102", "D103", "D107", "ANN201", "ANN001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
# acryl-datahub ships partial annotations; its generated schema classes are not
# typed strictly enough to follow into.
[[tool.mypy.overrides]]
module = ["datahub.*"]
follow_untyped_imports = true

# DataHub's Agent Context Kit, imported only inside try/except ImportError in
# janus/agent/context_kit.py. It cannot be installed here at all (its
# releases pin acryl-datahub==1.6.0.6 against this project's 1.6.0.13, see the
# optional-dependencies note above), so mypy has nothing to resolve and the
# absence is the expected state rather than a missing dev dependency.
[[tool.mypy.overrides]]
module = ["datahub_agent_context.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a live DataHub Quickstart plus the seeded ML graph",
]
# Unit runs stay offline and fast; integration is opt-in.
addopts = "-m 'not integration'"

[tool.mutmut]
# T-08 (docs/plan/10-depth-implementation.md): the claim under test is
# detection, so only janus/detect/ is mutated; mutating the whole
# package would measure something this task never claimed. source_paths still
# copies all of janus, because a detector's own imports (models, config,
# column_marks) have to resolve and the full offline suite runs against the
# copy; only_mutate is what keeps cli.py or writeback/ from padding the
# survivor count. also_copy adds what the full suite reads off disk beyond
# janus and tests/ (both already copied by default): the adapter fixture
# repo, the sprite art and its two other readers, benchmarks/, which
# tests/benchmarks/ imports directly, and README.md, which tests/test_docs.py
# reads. A file the suite opens and this list omits is not a failing test but a
# collection error inside the copied tree, which mutmut reports as every mutant
# having no tests: a 0.00 score with nothing to say what went wrong (D-125).
source_paths = ["janus"]
only_mutate = ["janus/detect/*"]
also_copy = ["examples/", "argos/", "site/", "benchmarks/", "README.md"]
# type_check_command (mutmut's mypy-assisted filter, verified against 3.7.0):
# tried and reverted. It crashes on this codebase --
# "Could not find mutant for type error ...trust_score.py:7345 (Unused
# 'type: ignore' comment)" -- because a mutation shifts which line an existing
# `# type: ignore` covers, mypy reports that comment unused, and mutmut cannot
# map the error back to a mutant. Real: a `None`-for-`bool` survivor is a class
# mypy strict already refuses to merge (pre-commit), so RESULTS.md's mutation
# section names it as a class rather than pretending each instance is an
# undiscovered gap. Revisit if a later mutmut release fixes the crash.
# Diagnostic-only calls, never a decision or a graph write (janus/CLAUDE.md
# rule 2's layer boundary: detect/ is pure). A corrupted log line is invisible
# to every consumer this project has; see also mutmut's own README example for
# this exact pattern.
do_not_mutate_patterns = ['logger\.\w+\(']
