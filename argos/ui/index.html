<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Argos</title>
    <style>
      :root {
        --ink: #12233f;
        --coat: #f7f7f7;
        --blue: #1857d2;
        --amber: #f39f19;
        --red: #e90101;
        --stage: #1a1f2b;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        /* The window is a pet, not a document: nothing is selectable and the
           caret must never appear over the dog. */
        user-select: none;
        cursor: default;
        font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: var(--coat);
      }

      /* The whole window arrives rather than appearing: a pet that pops into
         existence at full size reads as a glitch. */
      #stage {
        position: absolute;
        inset: 0;
        animation: enter 420ms cubic-bezier(0.2, 0.9, 0.3, 1.2) both;
      }

      @keyframes enter {
        from {
          opacity: 0;
          transform: translateY(10px) scale(0.94);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      #dog {
        position: absolute;
        left: 50%;
        bottom: 4px;
        transform: translateX(-50%);
        image-rendering: pixelated;
        transition: transform 140ms ease-out;
      }

      /* A pet you can point at should notice: the lift is the affordance that
         says this thing is draggable and clickable. */
      #dog:hover {
        transform: translateX(-50%) translateY(-2px);
      }

      #bubble {
        position: absolute;
        left: 6px;
        right: 6px;
        top: 6px;
        padding: 7px 8px 8px;
        background: var(--stage);
        border: 2px solid var(--ink);
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
        opacity: 0;
        transform: translateY(-4px);
        transition:
          opacity 180ms ease,
          transform 180ms ease;
        pointer-events: none;
      }

      #bubble.shown {
        opacity: 1;
        transform: none;
      }

      /* The pointer, drawn as two stacked triangles so it keeps the 2px ink
         border the box has. */
      #bubble::after,
      #bubble::before {
        content: "";
        position: absolute;
        left: 50%;
        border: 7px solid transparent;
      }

      #bubble::before {
        bottom: -16px;
        margin-left: -7px;
        border-top-color: var(--ink);
      }

      #bubble::after {
        bottom: -11px;
        margin-left: -7px;
        border-top-color: var(--stage);
      }

      #bubble .chip {
        display: inline-block;
        margin-right: 5px;
        padding: 0 4px;
        background: var(--amber);
        color: var(--ink);
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      #bubble .chip.high,
      #bubble .chip.critical {
        background: var(--red);
        color: var(--coat);
      }

      #bubble .text {
        display: block;
        max-height: 58px;
        overflow: hidden;
        word-break: break-word;
      }

      /* Trust, when the event carries it: ten segments, because a number nobody
         can read at a glance is not ambient. */
      #trust {
        display: none;
        margin-top: 6px;
        gap: 2px;
      }

      #trust.shown {
        display: flex;
      }

      #trust i {
        flex: 1;
        height: 4px;
        background: #2b3446;
      }

      #trust i.on {
        background: var(--blue);
      }

      #trust.watch i.on {
        background: var(--amber);
      }

      #trust.risk i.on {
        background: var(--red);
      }

      #menu {
        position: absolute;
        left: 8px;
        bottom: 8px;
        display: none;
        min-width: 132px;
        padding: 3px;
        background: var(--stage);
        border: 2px solid var(--ink);
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.5);
      }

      #menu.shown {
        display: block;
      }

      #menu .head {
        padding: 2px 7px 4px;
        color: #7f8da8;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      #menu button {
        display: flex;
        align-items: center;
        gap: 7px;
        width: 100%;
        padding: 4px 7px;
        border: 0;
        background: transparent;
        color: var(--coat);
        font: inherit;
        text-align: left;
        cursor: pointer;
      }

      #menu button:hover {
        background: var(--blue);
      }

      #menu button b {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: var(--amber);
      }

      #menu button:nth-child(3) b {
        background: var(--blue);
      }

      #menu button:nth-child(4) b {
        background: #7f8da8;
      }

      #menu button:nth-child(5) b {
        background: var(--coat);
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="bubble">
        <span class="text"></span>
        <div id="trust"></div>
      </div>
      <canvas id="dog" width="192" height="192"></canvas>
      <div id="menu">
        <div class="head">argos</div>
        <button type="button" data-cmd="scan_now"><b></b>Scan now</button>
        <button type="button" data-cmd="approve"><b></b>Approve pending</button>
        <button type="button" data-cmd="mute"><b></b>Mute 1h</button>
        <button type="button" data-cmd="open_datahub"><b></b>Open in DataHub</button>
      </div>
    </div>
    <script src="sprites.js"></script>
    <script src="argos.js"></script>
  </body>
</html>
