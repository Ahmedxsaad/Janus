<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Argos</title>
    <style>
      :root {
        --ink: #101f38;
        --coat: #fbfcfe;
        --blue: #2668e8;
        --amber: #ffab21;
        --red: #f22525;
        --stage: #16203a;
        --stage-edge: #24304f;
        --muted: #8898b6;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        /* The window is a pet, not a document: nothing is selectable and the
           caret must never appear over the dog. */
        user-select: none;
        cursor: default;
        font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: var(--coat);
      }

      /* The whole window arrives rather than appearing: a pet that pops into
         existence at full size reads as a glitch. */
      #stage {
        position: absolute;
        inset: 0;
        /* A column that stacks bottom-up is what keeps the bubble sitting on the
           dog's head. The bubble used to be pinned to the top of the window with
           a fixed height, so in a transparent, undecorated window it floated in
           empty space with its tail pointing at nothing, and any title longer
           than two lines was silently cut off. Laying them out in flow means the
           bubble is always exactly as tall as its text and always directly above
           the head, whatever the text turns out to be. */
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: center;
        animation: enter 420ms cubic-bezier(0.2, 0.9, 0.3, 1.2) both;
      }

      @keyframes enter {
        from {
          opacity: 0;
          transform: translateY(10px) scale(0.94);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      /* The dog roams inside this strip, so it is the full width of the window
         and the canvas is moved within it rather than the window being moved
         around the desktop. */
      #floor {
        position: relative;
        width: 100%;
        height: 128px;
        flex: none;
      }

      #dog {
        position: absolute;
        bottom: 0;
        left: 0;
        image-rendering: pixelated;
        /* No CSS transition on the position: the roam loop sets it every frame
           and a transition would fight it, smearing the walk into a glide. */
      }

      /* The mark that slams in over his head when a state has something to
         exclaim or to ask, borrowed from the courtroom games: an interruption
         that fades in politely is not an interruption. It is punctuation on the
         state the producer already sent, never a claim of its own, which is why
         only two states carry one and neither of them invented itself. */
      #shout {
        position: absolute;
        /* Head height, over the shoulder. There is nowhere above the ears to
           put it: the sprite fills its 128px canvas and the bubble starts where
           the canvas stops, so the only free space at head height is behind
           him, which is where a comic puts an exclamation anyway. The script
           sets `left` from the direction he is facing. */
        left: 0;
        bottom: 96px;
        margin-left: -7px;
        display: none;
        color: var(--amber);
        font: italic 800 28px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        /* The heavy ink outline, done with four shadows rather than
           -webkit-text-stroke: the stroke property needs paint-order to sit
           behind the fill, and this window ships to three different webviews. */
        text-shadow:
          2px 0 0 var(--ink),
          -2px 0 0 var(--ink),
          0 2px 0 var(--ink),
          0 -2px 0 var(--ink),
          2px 2px 0 var(--ink),
          -2px 2px 0 var(--ink),
          2px -2px 0 var(--ink),
          -2px -2px 0 var(--ink),
          0 4px 8px rgba(0, 0, 0, 0.5);
        pointer-events: none;
      }

      #shout.shown {
        display: block;
        animation: slam 420ms cubic-bezier(0.15, 1.3, 0.4, 1) both;
      }

      /* Sleep is the exception: a Z that slammed in would wake the neighbours.
         It drifts up and away, over and over, for as long as he is out. */
      #shout.drift {
        color: var(--coat);
        font-size: 17px;
        animation: drift 2600ms ease-in-out infinite;
      }

      @keyframes slam {
        0% {
          opacity: 0;
          transform: scale(3.2) rotate(-26deg);
        }
        45% {
          opacity: 1;
          transform: scale(0.84) rotate(-4deg);
        }
        70% {
          transform: scale(1.14) rotate(-13deg);
        }
        100% {
          opacity: 1;
          transform: scale(1) rotate(-9deg);
        }
      }

      @keyframes drift {
        0% {
          opacity: 0;
          transform: translate(0, 8px) scale(0.6);
        }
        35% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translate(11px, -24px) scale(1.2);
        }
      }

      /* The thrown toy. It lands where the click was and he goes and gets it;
         like the petting, it is a reaction to a hand and says nothing about the
         catalogue. `left` is set from the click, the animation does the arc. */
      #ball {
        position: absolute;
        bottom: 7px;
        left: 0;
        display: none;
        box-sizing: border-box;
        width: 10px;
        height: 10px;
        margin-left: -5px;
        border: 2px solid var(--ink);
        border-radius: 50%;
        background: var(--blue);
        pointer-events: none;
      }

      #ball.shown {
        display: block;
        animation: toss 700ms cubic-bezier(0.32, 0, 0.7, 1) both;
      }

      @keyframes toss {
        0% {
          transform: translate(-30px, -132px) scale(0.7);
        }
        50% {
          transform: translate(0, 0) scale(1);
        }
        68% {
          transform: translateY(-18px);
        }
        84% {
          transform: translateY(0);
        }
        93% {
          transform: translateY(-5px);
        }
        100% {
          transform: translateY(0);
        }
      }

      #bubble {
        /* Sized by its content, never by a fixed height: clipping a finding's
           title is the one thing this element must not do. */
        width: calc(100% - 12px);
        margin: 0 6px 9px;
        padding: 7px 9px 8px;
        background: linear-gradient(180deg, var(--stage-edge), var(--stage));
        border: 2px solid var(--ink);
        border-radius: 3px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
        opacity: 0;
        transform: translateY(4px) scale(0.97);
        transition:
          opacity 180ms ease,
          transform 180ms cubic-bezier(0.2, 0.9, 0.3, 1.2);
        pointer-events: none;
        /* Out of flow while hidden, so the dog stands on the floor rather than
           being pushed down by an invisible box. */
        position: absolute;
        bottom: 128px;
        left: 0;
        box-sizing: border-box;
      }

      #bubble.shown {
        opacity: 1;
        transform: none;
      }

      /* The pointer, drawn as two stacked triangles so it keeps the 2px ink
         border the box has. It tracks the dog horizontally, which is the other
         half of the fix: a tail fixed at 50% pointed into empty space as soon
         as the dog walked away from the middle. */
      #bubble::after,
      #bubble::before {
        content: "";
        position: absolute;
        left: var(--tail, 50%);
        border: 7px solid transparent;
      }

      #bubble::before {
        bottom: -16px;
        margin-left: -7px;
        border-top-color: var(--ink);
      }

      #bubble::after {
        bottom: -11px;
        margin-left: -7px;
        border-top-color: var(--stage);
      }

      #bubble .chip {
        display: inline-block;
        margin-right: 5px;
        padding: 0 4px;
        border-radius: 2px;
        background: var(--amber);
        color: var(--ink);
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      #bubble .chip.high,
      #bubble .chip.critical {
        background: var(--red);
        color: var(--coat);
      }

      #bubble .text {
        display: block;
        /* Wraps and stays readable. The old rule capped this at 58px with
           overflow hidden, which silently ate the end of every real finding
           title, and a watchdog that truncates what it found is worse than one
           that says nothing. */
        max-height: 92px;
        overflow-y: auto;
        overflow-wrap: anywhere;
        scrollbar-width: none;
      }

      #bubble .text::-webkit-scrollbar {
        display: none;
      }

      /* Trust, when the event carries it: ten segments, because a number nobody
         can read at a glance is not ambient. */
      #trust {
        display: none;
        margin-top: 6px;
        gap: 2px;
      }

      #trust.shown {
        display: flex;
      }

      #trust i {
        flex: 1;
        height: 4px;
        border-radius: 1px;
        background: #2b3446;
        transition: background 220ms ease;
      }

      #trust i.on {
        background: var(--blue);
      }

      #trust.watch i.on {
        background: var(--amber);
      }

      #trust.risk i.on {
        background: var(--red);
      }

      #menu {
        position: absolute;
        left: 8px;
        bottom: 8px;
        z-index: 2;
        display: none;
        min-width: 132px;
        padding: 3px;
        background: var(--stage);
        border: 2px solid var(--ink);
        border-radius: 3px;
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.5);
      }

      #menu.shown {
        display: block;
      }

      #menu .head {
        padding: 2px 7px 4px;
        color: var(--muted);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      #menu button {
        display: flex;
        align-items: center;
        gap: 7px;
        width: 100%;
        padding: 4px 7px;
        border: 0;
        border-radius: 2px;
        background: transparent;
        color: var(--coat);
        font: inherit;
        text-align: left;
        cursor: pointer;
      }

      #menu button:hover {
        background: var(--blue);
      }

      #menu button b {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 1px;
        background: var(--amber);
      }

      #menu button:nth-child(3) b {
        background: var(--blue);
      }

      #menu button:nth-child(4) b {
        background: var(--muted);
      }

      #menu button:nth-child(5) b {
        background: var(--coat);
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="bubble">
        <span class="text"></span>
        <div id="trust"></div>
      </div>
      <div id="floor">
        <canvas id="dog" width="128" height="128"></canvas>
        <i id="shout"></i>
        <i id="ball"></i>
      </div>
      <div id="menu">
        <div class="head">argos</div>
        <button type="button" data-cmd="scan_now"><b></b>Scan now</button>
        <button type="button" data-cmd="approve"><b></b>Approve pending</button>
        <button type="button" data-cmd="mute"><b></b>Mute 1h</button>
        <button type="button" data-cmd="open_datahub"><b></b>Open in DataHub</button>
      </div>
    </div>
    <script src="sprites.js"></script>
    <script src="argos.js"></script>
  </body>
</html>
