[package]
name = "janus-argos"
version = "0.1.0"
edition = "2021"
description = "Argos, the DataHub watchdog: a desktop window driven by a JSON event stream on stdin"
license = "Apache-2.0"
repository = "https://github.com/Ahmedxsaad/janus"

[[bin]]
name = "janus-argos"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api is what makes a transparent window possible on macOS. It is
# a private API, so the app can never ship on the Mac App Store; it ships
# through pip and GitHub Releases, neither of which cares (docs/plan/08).
tauri = { version = "2", features = ["macos-private-api"] }
serde_json = "1"

[profile.release]
# The wheel carries this binary, so size is a user-facing number.
opt-level = "s"
lto = true
strip = true
