# Runs the checks a reviewer would otherwise have to run by hand, on every push
# and every pull request (docs/plan/04-improvements.md P2-1).
#
# What is deliberately NOT here: the integration suite. Those 39 tests need a live
# DataHub Quickstart, which is a multi-container stack (GMS, MySQL, Kafka,
# OpenSearch, frontend) wanting more memory than a hosted runner has. Starting it
# here would buy a slow, flaky job that fails for reasons unrelated to the change
# under review, and a red build nobody trusts is worse than no build. They stay a
# local gate, run before a release and before anything merges to main, and the
# offline suite below is written to be the fast half rather than the weak half.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint, types, offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # Pinned, not a range: acryl-datahub's CLI warns above 3.11 and
          # pyproject caps requires-python there. CI must run what developers run.
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the project and its dev tools
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      # pre-commit rather than a hand-written list of ruff and mypy invocations,
      # so the hooks developers run locally and the checks CI enforces cannot
      # drift apart. It also picks up the hygiene hooks: private keys, merge
      # conflict markers, large files, and the em-dash ban the formatting rules
      # require and nothing else enforces.
      - name: Lint, format, types, hygiene
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Offline tests
        # -m 'not integration' is already the default in pyproject's addopts;
        # stated here so a reader of this file knows what did and did not run.
        run: pytest -m "not integration" -q

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the project
        run: python -m pip install --upgrade pip && pip install -e "." pip-audit

      # This job blocks. An audit that cannot fail teaches everyone to ignore it,
      # and a job wearing a permanent red X teaches the same lesson faster, so a
      # known-and-unfixable finding is named here rather than tolerated by
      # letting the whole job fail forever.
      #
      # PYSEC-2026-3447 (setuptools, MANIFEST.in exclusions bypassed by Unicode
      # normalization when building an sdist) is fixed in 83.0.0, and
      # acryl-datahub 1.6.0.13 declares setuptools<82.0.0. No environment holding
      # the SDK can satisfy both, so this is not a finding this project can act
      # on. It is not reachable either: the flaw is in *building* an sdist, and
      # nothing here builds or publishes one. Reported upstream as finding 13 in
      # docs/most-valuable-feedback.md.
      #
      # Scoped to that one id on purpose. Any other advisory, including a future
      # one against setuptools, still fails this job. Delete the flag the moment
      # acryl-datahub raises its ceiling.
      - name: Audit dependencies for known vulnerabilities
        run: pip-audit --progress-spinner off --ignore-vuln PYSEC-2026-3447

  docker:
    name: docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # A build-only smoke test, not a functional one: actually running the
      # image needs a live DataHub, which is the same multi-container weight the
      # integration suite is kept off hosted runners for (see the note at the
      # top of this file). What this catches is real anyway: a Dockerfile that
      # stops building is invisible until someone tries to `docker build`, and
      # by then it is release day, not code-review day.
      - name: Build the image
        run: docker build -t modelguard:ci .

      - name: The image runs as its declared non-root user
        run: |
          test "$(docker run --rm --entrypoint whoami modelguard:ci)" = "modelguard"

      # Two different checks, because the four console scripts do not agree on
      # --help. modelguard (Typer) and modelguard-scenario (argparse) parse
      # arguments before doing anything else, so --help exits 0 with no network.
      # modelguard-seed and modelguard-mcp have no argument parser at all: they
      # connect to DataHub immediately, so --help would just be ignored and the
      # command would fail on a real, expected DataHubConnectionError, not on a
      # packaging problem. For those two, `command -v` is the honest test: it
      # confirms the entry point installed without executing anything network-
      # bound, exactly the boundary the integration suite is kept off this
      # runner for.
      - name: The two scripts with argument parsing answer --help
        run: |
          for cmd in modelguard modelguard-scenario; do
            docker run --rm --entrypoint "$cmd" modelguard:ci --help >/dev/null
          done

      - name: The two network-first scripts are installed on PATH
        run: |
          docker run --rm --entrypoint sh modelguard:ci -c \
            'command -v modelguard-seed && command -v modelguard-mcp'

  helm:
    name: helm chart lints and renders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v4
        with:
          version: v3.21.3

      - name: Lint
        run: helm lint --strict charts/modelguard-watch

      # No live cluster here, same reasoning as the integration suite and the
      # docker job: this proves the chart renders valid Kubernetes YAML for a
      # realistic install, not that a pod actually starts. Two renders, not
      # one: the bare-values render must fail (watch.table/model,
      # datahub.gmsUrl and image.repository have no default on purpose, see
      # values.yaml), and a real render must succeed and produce exactly the
      # three resources this chart is meant to create.
      - name: A bare install fails loudly on the required values
        run: |
          if helm template charts/modelguard-watch >/dev/null 2>&1; then
            echo "::error::a bare install rendered successfully; the required-value guards in deployment.yaml are not firing"
            exit 1
          fi

      - name: A real install renders exactly the expected resources
        run: |
          helm template test charts/modelguard-watch \
            --set image.repository=ghcr.io/example/modelguard \
            --set image.tag=0.1.0 \
            --set datahub.gmsUrl=http://datahub-gms:8080 \
            --set watch.table=loans_raw \
            > /tmp/rendered.yaml
          for kind in ServiceAccount Secret Deployment; do
            grep -q "^kind: $kind\$" /tmp/rendered.yaml || {
              echo "::error::expected a $kind in the rendered output, found none"
              exit 1
            }
          done

  deploy-files:
    name: deploy runbook files are syntactically valid
    runs-on: ubuntu-latest
    # No live Azure VM to test against, same reasoning as the docker and helm
    # jobs above: this proves the files are well-formed, not that a real VM
    # provisions correctly from them. docs/deploy/azure-vm.md says so too.
    steps:
      - uses: actions/checkout@v5

      - name: cloud-init.yaml is valid YAML with the expected top-level shape
        run: |
          python3 -c "
          import yaml
          with open('deploy/azure/cloud-init.yaml') as f:
              d = yaml.safe_load(f.read())
          assert 'runcmd' in d, 'missing expected cloud-config section: runcmd'
          print(f\"{len(d['runcmd'])} runcmd entries\")
          "

      - name: Every runcmd shell fragment is syntactically valid
        run: |
          python3 -c "
          import yaml
          with open('deploy/azure/cloud-init.yaml') as f:
              d = yaml.safe_load(f.read())
          script = '#!/bin/bash\nset -e\n'
          for cmd in d['runcmd']:
              if isinstance(cmd, list):
                  script += ' '.join(f\"'{c}'\" if ' ' in str(c) or '/' in str(c) else str(c) for c in cmd) + '\n'
              else:
                  script += cmd + '\n'
          with open('/tmp/runcmd.sh', 'w') as out:
              out.write(script)
          "
          bash -n /tmp/runcmd.sh

      - name: modelguard-watch.service passes systemd-analyze verify
        run: |
          sudo systemd-analyze verify deploy/azure/modelguard-watch.service
