# Builds the Argos desktop window for every platform it can ship on, and
# attaches the results to the release.
#
# Two artefact kinds come out of one crate, because there are two install
# routes and neither covers everybody:
#
# * platform wheels (maturin), so `pip install "janus-datahub[pet]"` puts a
#   window on macOS and Windows with no Rust toolchain in sight;
# * OS bundles (`cargo tauri build`), which is the only route on Linux. That is
#   policy rather than effort: the binary links the system webkit2gtk, which no
#   manylinux tag permits, so PyPI will not accept a Linux wheel
#   (docs/plan/08-watchdog-mascot.md section 6b).
#
# Windows is the one platform this repository cannot test from a developer
# machine, and it is where the transport is least certain: a release build sets
# windows_subsystem="windows" and has no console, so the inherited stdin and
# stdout pipe handles are what the whole thing rests on. The smoke step below
# feeds one event in and fails the build if the binary does not take it.
name: Build Argos

on:
  push:
    tags:
      # janus-argos versions independently of janus-datahub, so it has its own
      # tag namespace. Publishing the window must not burn a version number on
      # the Python distribution, and a Python-only fix must not force the crate
      # to move: they are two distributions on purpose (argos/pyproject.toml).
      - "argos-v*.*.*"
      # A product release still builds and publishes the window it ships with,
      # which is what makes `janus-datahub[pet]` installable on the day the
      # Python package goes out.
      - "v*.*.*"
  # Buildable on demand as well: the compile is the slow part of reviewing a
  # change to the crate, and nobody should have to cut a tag to find out.
  workflow_dispatch:
    inputs:
      # An escape hatch for the day a tag push does not schedule a run, which
      # leaves a release with nowhere to go and no way to retry: a queued run
      # that never starts has no re-run button. Off by default, so the ordinary
      # dispatch stays a build and only a deliberate tick publishes.
      publish:
        description: also publish janus-argos to PyPI
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing to build must not hide whether the others did.
      fail-fast: false
      matrix:
        include:
          - name: macos arm64
            os: macos-14
            wheel: true
          # Intel macOS, on the only image GitHub still offers for it. macos-13
          # was retired, and a label with no runners behind it does not fail:
          # the job queues forever, which is a harder thing to notice than an
          # error. If this label goes the same way, the choice is a cross build
          # from the arm64 runner (`rustup target add x86_64-apple-darwin`,
          # maturin `--target`, no smoke because the binary will not run there)
          # or dropping Intel macOS from the extra.
          - name: macos x86_64
            os: macos-15-intel
            wheel: true
          - name: windows x86_64
            os: windows-latest
            wheel: true
          - name: linux x86_64
            os: ubuntu-22.04
            wheel: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - uses: dtolnay/rust-toolchain@stable

      # Tauri's Linux webview and its dependencies. Nothing to install on macOS
      # or Windows: the system webview is part of the OS there.
      - name: install the Linux webview
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf xvfb

      - name: the stdin parser
        working-directory: argos
        run: cargo test --release

      - name: build the binary
        working-directory: argos
        run: cargo build --release

      # The transport, checked on the platform rather than assumed. One event
      # in, and the process must still be alive: a binary that cannot read its
      # own stdin is a window that will never show anything.
      #
      # Linux runs under a virtual display. GTK is initialised before the stdin
      # thread starts, so with no DISPLAY the process aborts on
      # "Failed to initialize GTK" and never reaches the transport this step
      # exists to check. macOS and Windows runners have a real window server.
      - name: smoke the stdio transport
        run: ${{ startsWith(matrix.os, 'ubuntu') && 'xvfb-run -a' || '' }} python .github/scripts/smoke_argos.py

      - name: build the wheel
        if: matrix.wheel
        working-directory: argos
        run: |
          python -m pip install "maturin>=1.7,<2"
          maturin build --release --out dist

      # The .dmg, .msi, .deb and .AppImage. Unsigned, which matters only for the
      # download route: pip does not set the macOS quarantine attribute or the
      # Windows mark of the web, so a wheel-installed binary starts without a
      # Gatekeeper or SmartScreen prompt and a downloaded bundle does not.
      - name: build the OS bundles
        working-directory: argos
        run: |
          cargo install tauri-cli --version "^2" --locked
          cargo tauri build

      # Wheels and bundles go to separate artifacts because they have separate
      # destinations: the wheels are merged into one directory and uploaded to
      # PyPI, the bundles are attached to the GitHub release. Merging them from
      # a single per-OS artifact would mean unpicking the two apart again.
      - uses: actions/upload-artifact@v4
        if: matrix.wheel
        with:
          name: argos-wheel-${{ matrix.os }}
          if-no-files-found: error
          path: argos/dist/*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: argos-bundle-${{ matrix.os }}
          if-no-files-found: warn
          path: argos/target/release/bundle/**/*

  # Only the wheels, and only on a tag. PyPI will not take the Linux binary at
  # all (it links the system webkit2gtk, which no manylinux tag permits), so
  # Linux reaches users through the release attachment below instead.
  publish:
    name: publish janus-argos to PyPI
    needs: build
    # `inputs` is null outside a dispatch, so a tag push takes the first arm and
    # a dispatch publishes only when the box was ticked.
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/janus-argos
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: argos-wheel-*
          merge-multiple: true
          path: dist/

      # An `argos-v` tag names a version of the crate, so a tag that disagrees
      # with Cargo.toml is a mistake rather than something to publish anyway.
      # The check is skipped for a `v` product tag, which names the Python
      # distribution's version and says nothing about the crate's.
      - name: The tag matches the version in Cargo.toml
        if: startsWith(github.ref_name, 'argos-v')
        run: |
          tag="${GITHUB_REF_NAME#argos-v}"
          cargo="$(python3 -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("argos/Cargo.toml").read_text())["package"]["version"])')"
          if [ "$tag" != "$cargo" ]; then
            echo "::error::tag $GITHUB_REF_NAME implies version $tag, but argos/Cargo.toml declares $cargo"
            exit 1
          fi
          echo "tag and Cargo.toml agree on $cargo"

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # The crate's version moves on its own schedule, so a product tag
          # will usually carry a janus-argos that is already on PyPI. That is
          # the normal case here, not a failure: skip it and publish nothing.
          skip-existing: true

  # The Linux install route. Unsigned, which matters only for a download: pip
  # sets neither the macOS quarantine attribute nor the Windows mark of the
  # web, so a wheel-installed binary starts without a Gatekeeper or SmartScreen
  # prompt and a downloaded bundle does not.
  release:
    name: attach the bundles to the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: argos-bundle-*
          path: bundles/

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            bundles/**/*.deb
            bundles/**/*.AppImage
            bundles/**/*.dmg
            bundles/**/*.msi
