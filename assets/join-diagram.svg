<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 208" role="img" aria-label="Column-level lineage runs from a raw table through a staging column into a feature table. DataHub's ML graph holds the model and its training run. Nothing joins the two until janus link writes the edge from feature to source column."><rect width="720" height="208" fill="#faf5ea"></rect><defs><marker id="aj" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b1d13"></path></marker><marker id="wj" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9a5d21"></path></marker><marker id="bj" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6e1f26"></path></marker></defs><rect x="6" y="6" width="392" height="196" rx="12" fill="#f2ead9" stroke="#e2d5bf"></rect><text x="22" y="28" fill="#a08b76" font-family="ui-monospace,monospace" font-size="11" letter-spacing="1.4">WAREHOUSE GRAPH</text><rect x="26" y="52" width="118" height="46" rx="8" fill="#faf5ea" stroke="#d8c8ad"></rect><text x="85.0" y="72.0" text-anchor="middle" fill="#2b1d13" font-family="ui-monospace,monospace" font-size="11">loans_raw</text><text x="85.0" y="88.0" text-anchor="middle" fill="#a08b76" font-family="ui-monospace,monospace" font-size="10">raw table</text><rect x="166" y="52" width="118" height="46" rx="8" fill="#faf5ea" stroke="#d8c8ad"></rect><text x="225.0" y="72.0" text-anchor="middle" fill="#2b1d13" font-family="ui-monospace,monospace" font-size="11">stg_customers</text><text x="225.0" y="88.0" text-anchor="middle" fill="#a08b76" font-family="ui-monospace,monospace" font-size="10">staging</text><rect x="18" y="130" width="274" height="46" rx="8" fill="#faf5ea" stroke="#2b1d13"></rect><text x="155.0" y="150.0" text-anchor="middle" fill="#2b1d13" font-family="ui-monospace,monospace" font-size="10">customer_features.contract_renewed_flag</text><text x="155.0" y="166.0" text-anchor="middle" fill="#9a5d21" font-family="ui-monospace,monospace" font-size="10">a column, not a table</text><path d="M144,75 L162,75" fill="none" stroke="#2b1d13" stroke-width="1.5" marker-end="url(#aj)"></path><path d="M225,98 L225,118 L160,118 L160,126" fill="none" stroke="#2b1d13" stroke-width="1.5" marker-end="url(#aj)"></path><rect x="420" y="6" width="294" height="196" rx="12" fill="#f2ead9" stroke="#e2d5bf"></rect><text x="436" y="28" fill="#a08b76" font-family="ui-monospace,monospace" font-size="11" letter-spacing="1.4">ML GRAPH</text><rect x="440" y="52" width="118" height="46" rx="8" fill="#faf5ea" stroke="#d8c8ad"></rect><text x="499.0" y="72.0" text-anchor="middle" fill="#2b1d13" font-family="ui-monospace,monospace" font-size="11">training run</text><text x="499.0" y="88.0" text-anchor="middle" fill="#a08b76" font-family="ui-monospace,monospace" font-size="10">mlflow</text><rect x="578" y="52" width="118" height="46" rx="8" fill="#faf5ea" stroke="#d8c8ad"></rect><text x="637.0" y="72.0" text-anchor="middle" fill="#2b1d13" font-family="ui-monospace,monospace" font-size="11">credit_risk_v3</text><text x="637.0" y="88.0" text-anchor="middle" fill="#a08b76" font-family="ui-monospace,monospace" font-size="10">live model</text><rect x="508" y="130" width="118" height="46" rx="8" fill="#faf5ea" stroke="#2b1d13"></rect><text x="567.0" y="150.0" text-anchor="middle" fill="#2b1d13" font-family="ui-monospace,monospace" font-size="11">mlFeature</text><text x="567.0" y="166.0" text-anchor="middle" fill="#a08b76" font-family="ui-monospace,monospace" font-size="10">what it trained on</text><path d="M558,75 L574,75" fill="none" stroke="#2b1d13" stroke-width="1.5" marker-end="url(#aj)"></path><path d="M567,126 L567,112 L637,112 L637,102" fill="none" stroke="#2b1d13" stroke-width="1.5" marker-end="url(#aj)"></path><path d="M296,153 L504,153" fill="none" stroke="#9a5d21" stroke-width="2" stroke-dasharray