# A Feast repository, small enough to read in one screen and complete enough to
# import: `janus link --from feast --repo examples/feature-repo/feature_repo`
# reads the join out of it. Nothing here connects anywhere; the adapter parses
# the declaration and never talks to a store.
project: churn
registry: registry.db
provider: local
online_store:
    type: sqlite
    path: online_store.db
entity_key_serialization_version: 3
