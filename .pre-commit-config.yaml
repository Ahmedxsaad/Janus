# Enforces the clean-code and formatting rules from CLAUDE.md with tools rather
# than review comments. Install once per clone: pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # mypy runs from the project environment, not an isolated one. The isolated
  # env cannot see acryl-datahub, so every datahub.* symbol degraded to Any, the
  # follow_untyped_imports override in pyproject.toml never applied, and the hook
  # reported errors that a local `mypy janus/` does not. Installing the SDK
  # into the hook env instead would download it a second time. Running the
  # project's own mypy makes the hook agree with the local run by construction.
  #
  # Requires the dev extra: pip install -e ".[dev]"
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        # benchmarks/ is checked too: it is the code that produces the numbers in
        # RESULTS.md, so a type error there is a wrong published measurement, not
        # a broken script.
        files: ^(janus|benchmarks)/
        pass_filenames: false
        args: ["janus/", "benchmarks/"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        # charts/*/templates/ is Go template syntax ({{ .Values.x }}), not
        # YAML on its own; check-yaml's parser rejects it. `helm lint` and
        # `helm template` are this project's actual syntax check for those
        # files (both run against every chart change before it merges), so
        # this exclusion is not a gap, it is routing the check to the tool
        # that understands the format.
        exclude: ^charts/.*/templates/
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: check-merge-conflict
      # .env holds tokens and must never be committed (CLAUDE.md git rules).
      - id: detect-private-key

  - repo: local
    hooks:
      # The formatting rules ban em dashes and emojis everywhere, including in
      # code, comments, docs, and commit messages. Nothing else enforces this.
      #
      # This file is excluded because the pattern below IS an em dash: the hook
      # cannot state what it forbids without containing it, so it would flag
      # itself and `pre-commit run --all-files` could never pass.
      - id: no-em-dash
        name: no em dashes
        entry: '—'
        language: pygrep
        types: [text]
        exclude: ^\.pre-commit-config\.yaml$
