{{- if not (or .Values.watch.table .Values.watch.model) -}}
{{- fail "Set watch.table and/or watch.model. `modelguard watch` refuses to start with neither, and finding that out from a CrashLoopBackOff instead of here would waste a debugging session on a one-line config." -}}
{{- end -}}
{{- if not .Values.datahub.gmsUrl -}}
{{- fail "Set datahub.gmsUrl. No default: a missing value must fail loudly here, at install, not connect silently to whatever localhost:8080 happens to resolve to inside the cluster (modelguard/env.py's own rule, applied to this chart)." -}}
{{- end -}}
{{- if not .Values.image.repository -}}
{{- fail "Set image.repository. No default is baked in on purpose; see values.yaml." -}}
{{- end -}}
{{- if gt (int .Values.replicaCount) 1 -}}
{{- fail "replicaCount must be 1. Two watchers reaching the same model race on read-merge-write: DataHub has no conditional write, so each rewrites the model's whole structuredProperties aspect from a read that may already be stale, and the loser's trust score or risk flag is dropped silently (F3). Watch a second target with a second release, not with a second replica." -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "modelguard-watch.fullname" . }}
  labels:
    {{- include "modelguard-watch.labels" . | nindent 4 }}
spec:
  # One, checked above rather than merely documented: see values.yaml.
  replicas: {{ .Values.replicaCount }}
  strategy:
    # Recreate, not RollingUpdate: a rolling update runs the old and the new pod
    # at once, which is exactly the two-writers case the replica check refuses.
    # A watcher has no traffic to drain, so the gap costs one poll interval.
    type: Recreate
  selector:
    matchLabels:
      {{- include "modelguard-watch.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "modelguard-watch.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "modelguard-watch.serviceAccountName" . }}
      # See templates/serviceaccount.yaml: this workload never calls the
      # Kubernetes API, so it is set here too, since an explicit pod-level
      # value always wins over the ServiceAccount's own.
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        # Matches the image's own USER modelguard (uid 999, Dockerfile),
        # stated explicitly rather than left implicit: a cluster with a
        # restrictive PodSecurityStandard should not have to guess.
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: watch
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Overrides the image's default CMD (["--help"]); ENTRYPOINT stays
          # `modelguard`, so this is exactly the argv a person would type
          # after that command on their own machine.
          args:
            - watch
            {{- if .Values.watch.table }}
            - --table
            - {{ .Values.watch.table | quote }}
            {{- end }}
            {{- if .Values.watch.model }}
            - --model
            - {{ .Values.watch.model | quote }}
            {{- end }}
            - --interval
            - {{ .Values.watch.interval | quote }}
            {{- if .Values.watch.slaHours }}
            - --sla-hours
            - {{ .Values.watch.slaHours | quote }}
            {{- end }}
            {{- if .Values.watch.noLlm }}
            - --no-llm
            {{- end }}
          env:
            - name: DATAHUB_GMS_URL
              value: {{ .Values.datahub.gmsUrl | quote }}
            - name: DATAHUB_GMS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "modelguard-watch.secretName" . }}
                  key: {{ .Values.existingSecretGmsTokenKey }}
                  # A Quickstart with metadata-service auth disabled needs no
                  # token; a Secret carrying an empty value for this key is
                  # the expected, working case, not a misconfiguration.
                  optional: true
            {{- if not .Values.watch.noLlm }}
            {{- if .Values.watch.llmProvider }}
            - name: MODELGUARD_LLM_PROVIDER
              value: {{ .Values.watch.llmProvider | quote }}
            {{- end }}
            {{- if .Values.watch.llmModel }}
            - name: MODELGUARD_LLM_MODEL
              value: {{ .Values.watch.llmModel | quote }}
            {{- end }}
            - name: MODELGUARD_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "modelguard-watch.secretName" . }}
                  key: {{ .Values.existingSecretLlmApiKeyKey }}
                  # Absent entirely is the documented no-LLM fallback path
                  # (deterministic template prose), not an error; --no-llm is
                  # the explicit way to ask for it, this is the implicit one.
                  optional: true
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
              # readOnlyRootFilesystem makes /tmp read-only too unless
              # something is mounted over it. Nothing in this project writes
              # there, but the full dependency chain (acryl-datahub's HTTP
              # stack, langchain, the mcp SDK) was not exhaustively audited
              # for it, and there is no cluster in this environment to prove
              # a pod without this mount actually starts. An emptyDir costs
              # nothing and removes a whole class of CrashLoopBackOff nobody
              # could debug without cluster access to see the real error.
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
