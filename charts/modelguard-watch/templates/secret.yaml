{{/*
Only rendered when the caller did not bring their own Secret. This is the
quick-demo path: values passed via --set land in `helm get values` and this
release's stored history, in plain text. Set existingSecret instead for
anything that is not a local Quickstart.
*/}}
{{- if not .Values.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "modelguard-watch.fullname" . }}
  labels:
    {{- include "modelguard-watch.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.existingSecretGmsTokenKey }}: {{ .Values.secrets.gmsToken | quote }}
  {{ .Values.existingSecretLlmApiKeyKey }}: {{ .Values.secrets.llmApiKey | quote }}
{{- end -}}
