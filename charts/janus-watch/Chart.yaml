apiVersion: v2
name: janus-watch
description: >-
  Runs `janus watch` as a long-running Deployment: polls a table and/or
  model on an interval and writes back the moment a new problem appears. The
  other Janus entry points (scan, gate, the MCP server) are one-shot or
  CI-triggered and have no business being a standing Kubernetes workload; this
  chart exists because watch is the one that does.
type: application
version: 0.1.0
appVersion: "0.1.0"
home: https://github.com/Ahmedxsaad/janus
sources:
  - https://github.com/Ahmedxsaad/janus
keywords:
  - datahub
  - mlops
  - data-lineage
  - data-quality
maintainers:
  - name: Janus Contributors
    url: https://github.com/Ahmedxsaad/janus
