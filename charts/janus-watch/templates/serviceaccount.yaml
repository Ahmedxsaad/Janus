{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "janus-watch.serviceAccountName" . }}
  labels:
    {{- include "janus-watch.labels" . | nindent 4 }}
# This workload only ever talks to DataHub's own API over the network, never
# to the Kubernetes API server, so a mounted K8s API token would be a
# credential it holds and never uses: unnecessary blast radius if the pod is
# ever compromised. Set here and again at the pod level in deployment.yaml,
# because an explicit pod-level setting always wins over this one, so both
# have to say false for a future edit to either alone not to re-enable it.
automountServiceAccountToken: false
{{- end -}}
