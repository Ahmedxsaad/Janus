# Runs Janus against a DataHub Quickstart, not instead of one.
#
# `datahub docker quickstart` already builds and maintains DataHub's own
# multi-container stack (GMS, MySQL, Kafka, OpenSearch, frontend) on a network
# named `datahub_network`, with the GMS container reachable inside it as
# `datahub-gms:8080`. Reimplementing that stack here would be exactly the thing
# the hackathon's own Originality criterion warns against ("rebuilding shipped
# features from scratch isn't"), and it would drift the moment DataHub's compose
# changes upstream. This file only adds Janus to that existing network.
#
# One-time setup, then this file works every time after:
#   datahub docker quickstart
#
# Usage:
#   docker compose run --rm janus-seed
#   docker compose run --rm janus scan --table loans_raw
#   docker compose run --rm janus gate --model credit_risk_v3 --block-at-or-above high
#   docker compose up janus-mcp                    # long-running, stdio
#
# Every service below carries `profiles: [tools]`, so a bare `docker compose up`
# with no service named starts nothing (verified: `docker compose config
# --services` lists none of them). Naming a service explicitly, to `run` or to
# `up`, starts it regardless of the active profile; that asymmetry is exactly
# what is wanted here, since a scan or gate needs a --table/--model naming an
# actual target, and starting one against whatever the graph happens to hold on
# a bare `up` would be a guess, not a reproducible command.

# Named explicitly rather than left to compose's default (the directory name,
# lowercased: "datahub", identical to the project name `datahub docker
# quickstart` uses for its own stack). Sharing a project name is not cosmetic:
# `docker compose down --remove-orphans` run from this repo, an ordinary cleanup
# command, would then treat DataHub's entire Quickstart as orphaned containers of
# THIS project and stop it. Verified: with the shared default name, `docker
# compose up -d janus-mcp` immediately warned that every datahub-quickstart
# container was an "orphan container for this project". A distinct name makes
# every command here scoped to Janus's own containers only.
name: janus

x-janus: &janus
  build:
    context: .
    args:
      # Both extras baked in, so `... run --rm janus gate --review` and
      # `... up janus-mcp` work without a rebuild. No LLM provider extra:
      # the out-of-the-box path (deterministic template prose, --no-llm) needs
      # none, matching README.md.
      JANUS_EXTRAS: agent,mcp
  image: janus:local
  environment:
    DATAHUB_GMS_URL: http://datahub-gms:8080
    # Token, LLM provider/model/key, and every JANUS_* threshold pass
    # through from the shell that runs `docker compose`, via --env-file .env or
    # variables already exported. None has a default here: baking one in would
    # be exactly the machine-specific fallback janus/env.py forbids in the
    # package itself, applied to the container instead.
    DATAHUB_GMS_TOKEN: ${DATAHUB_GMS_TOKEN:-}
    JANUS_LLM_PROVIDER: ${JANUS_LLM_PROVIDER:-}
    JANUS_LLM_MODEL: ${JANUS_LLM_MODEL:-}
    JANUS_LLM_API_KEY: ${JANUS_LLM_API_KEY:-}
    JANUS_FRESHNESS_SLA_HOURS: ${JANUS_FRESHNESS_SLA_HOURS:-}
    JANUS_MAX_HOPS: ${JANUS_MAX_HOPS:-}
    JANUS_LINEAGE_RESULT_CAP: ${JANUS_LINEAGE_RESULT_CAP:-}
    JANUS_LEAKAGE_MAX_HOPS: ${JANUS_LEAKAGE_MAX_HOPS:-}
  networks:
    - datahub_network
  profiles:
    - tools

services:
  # janus scan --table ... | --model ... | --dry-run | --write | --review
  janus:
    <<: *janus

  # janus watch --table ... [--interval 30]
  janus-watch:
    <<: *janus
    entrypoint: ["janus", "watch"]

  # janus gate --model ... --block-at-or-above high  (exit 1 = blocked)
  janus-gate:
    <<: *janus
    entrypoint: ["janus", "gate"]

  # One-shot: build the demo ML supply chain the DataHub datapacks lack.
  janus-seed:
    <<: *janus
    entrypoint: ["janus-seed"]

  # janus-scenario --lag-hours 30 [--revert] [--scenario target-leakage|input-schema-drift]
  janus-scenario:
    <<: *janus
    entrypoint: ["janus-scenario"]

  # Long-running: serves check_leakage/check_freshness/check_gate over stdio.
  # `docker compose up janus-mcp` attaches this container's stdio to the
  # compose process's own, which is what an MCP client expects when it launches
  # a server itself; it is not meant to be started detached (`-d`).
  janus-mcp:
    <<: *janus
    entrypoint: ["janus-mcp"]
    stdin_open: true
    tty: false

networks:
  # Not created here. `datahub docker quickstart` creates it; declaring it
  # external is what stops `docker compose up` from silently creating a second,
  # disconnected network of the same name that can never reach datahub-gms.
  datahub_network:
    external: true
