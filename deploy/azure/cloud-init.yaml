#cloud-config
# First-boot provisioning for the judge-facing demo VM. Installs Docker,
# clones this repo, boots DataHub's own Quickstart, seeds and plants the demo
# scenario, and installs modelguard-watch.service so the graph keeps
# reflecting live findings without anyone needing to SSH in again.
#
# What this deliberately does NOT do: expose GMS (port 8080) to the internet.
# A Quickstart's metadata-service authentication is disabled by default (the
# judge's out-of-the-box path, see .env.example), which means an unauthenticated
# GMS answers arbitrary GraphQL writes to anyone who can reach it. The frontend
# (port 9002) has its own login and is the only thing this VM's network
# security group opens publicly; see docs/deploy/azure-vm.md for the NSG rules
# and for changing the frontend's default password before judging starts.
#
# Untested end to end: no live Azure VM exists in the environment this was
# written in, so cloud-init's own module directives were checked against
# their documented shape and the embedded shell logic was checked for syntax,
# but the full first-boot sequence has not been watched run for real. Do a
# smoke test after the first provision; docs/deploy/azure-vm.md says so too.
#
# __GITHUB_CLONE_TOKEN__ below is a placeholder, not a secret: this repo is
# private, so the git clone needs a credential. Never replace this placeholder
# with a real token in this tracked file. Substitute it only in the copy of
# this file's contents you paste into the Azure Portal's Custom Data box (not
# tracked anywhere), per docs/deploy/azure-vm.md. cloud-init writes runcmd
# values into /var/log/cloud-init-output.log and its own on-disk state in
# plaintext, so the token will sit readable-by-root on the VM after boot;
# scope it to read-only on this one repo and revoke it right after the first
# successful provision, once the clone has already happened.

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - git
  - ufw
  - unattended-upgrades

# A host firewall in addition to the cloud NSG, not instead of it: two
# independent layers, so a misconfigured NSG rule (or a future VNet peering
# nobody remembers this VM sits behind) is not the only thing standing
# between the internet and GMS.
runcmd:
  - [ufw, default, deny, incoming]
  - [ufw, default, allow, outgoing]
  - [ufw, allow, "22/tcp"]
  - [ufw, allow, "9002/tcp"]
  - [ufw, --force, enable]

  # get.docker.com is Docker's own, widely-used convenience install script.
  # Not pinned to a version: the base image's package repos age quickly
  # enough that pinning here would just mean debugging an install failure on
  # a VM nobody can interactively watch boot.
  - curl -fsSL https://get.docker.com -o /tmp/get-docker.sh
  - sh /tmp/get-docker.sh
  - usermod -aG docker azureuser

  # acryl-datahub (the `datahub` CLI) is what drives `datahub docker
  # quickstart`; installed into a venv rather than system Python so it cannot
  # collide with whatever the base image's own Python packages expect.
  - apt-get install -y python3-venv
  - python3 -m venv /opt/datahub-cli
  - /opt/datahub-cli/bin/pip install --quiet "acryl-datahub==1.6.0.13"
  - ln -sf /opt/datahub-cli/bin/datahub /usr/local/bin/datahub

  - mkdir -p /opt/modelguard
  - chown azureuser:azureuser /opt/modelguard
  - >-
    sudo -u azureuser git clone --depth 1
    https://__GITHUB_CLONE_TOKEN__@github.com/Ahmedxsaad/DataHub.git
    /opt/modelguard/DataHub

  # The .env write used to live in write_files, which cloud-init runs in an
  # early stage, before Azure has necessarily finished creating azureuser: an
  # owner: "azureuser:azureuser" there can race the account's own creation
  # and fail with "Unknown user or group", and (worse) it pre-creates the
  # target directory as root, which then makes the git clone above fail with
  # Permission Denied since azureuser cannot write into a root-owned
  # directory. Written here instead, right after the clone, once both
  # azureuser and the cloned repo already exist, so neither race is
  # possible, and before modelguard-seed below needs it. No
  # DATAHUB_GMS_TOKEN: the Quickstart this VM boots has metadata-service
  # authentication disabled (see the header comment), so writes go through
  # unauthenticated, exactly as they do in every other environment this
  # project has been run in. There is no key to leak here because none was
  # ever asked for.
  - >-
    sudo -u azureuser bash -c
    "echo DATAHUB_GMS_URL=http://localhost:8080 > /opt/modelguard/DataHub/.env"
  - chmod 600 /opt/modelguard/DataHub/.env

  # Boots the full DataHub stack (GMS, MySQL, Kafka, OpenSearch, frontend) on
  # datahub_network, the same network docker-compose.yml in this repo attaches
  # to. No --no-browser flag: none exists (checked against the installed
  # CLI's own --help rather than assumed), and none is needed. Run this same
  # way repeatedly during this project's own development on a machine with no
  # browser reachable from the shell (D-052 through D-055 sessions); it never
  # blocked on one.
  - sudo -u azureuser datahub docker quickstart

  # Waits for GMS rather than assuming quickstart's own return means it is
  # ready to accept writes: quickstart returns once containers are up, not
  # once GMS has finished extracting its WAR and serving /config (observed
  # directly in this project's own local environment, D-052/D-054 sessions).
  - >-
    timeout 300 bash -c
    'until curl -sf http://localhost:8080/config >/dev/null; do sleep 5; done'

  - cd /opt/modelguard/DataHub && sudo -u azureuser docker compose run --rm modelguard-seed
  - >-
    cd /opt/modelguard/DataHub && sudo -u azureuser
    docker compose run --rm modelguard-scenario --lag-hours 30

  - cp /opt/modelguard/DataHub/deploy/azure/modelguard-watch.service /etc/systemd/system/
  - systemctl daemon-reload
  - systemctl enable --now modelguard-watch.service
